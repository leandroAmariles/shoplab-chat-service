version: "1.0"

# No version: the linter must match the Qodana action of shoplab-ci. A pinned 2025.2 image with the 2026.2 action is
# reported as not compatible and could not resolve imported symbols (LAB-129).
linter: qodana-jvm-community

# shoplab-contracts and retrieval-service stubs come from GitHub Packages (LAB-129 / LAB-59).
bootstrap: mkdir -p "$HOME/.m2" && cp .mvn/ci-settings.xml "$HOME/.m2/settings.xml"

projectJDK: "21"

profile:
  name: qodana.recommended

exclude:
  - name: All
    paths:
      - target

failureConditions:
  severityThresholds:
    critical: 0
    high: 0
